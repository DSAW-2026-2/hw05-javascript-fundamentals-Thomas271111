<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi hato — Corral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@400;500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-[#faf8f4] text-[#2b2b26] dark:bg-gray-900 dark:text-gray-100 font-sans">

  <header class="border-b border-[#ddd6c9] dark:border-gray-700">
    <nav class="max-w-[1400px] mx-auto flex flex-wrap items-center justify-between gap-6 px-4 py-4 md:px-10 lg:px-[120px]">
      <a href="index.html" class="font-['Schibsted_Grotesk'] font-semibold text-2xl tracking-[-1.44px] text-black dark:text-white">Corral</a>
      <ul class="flex flex-wrap gap-6 font-['Schibsted_Grotesk'] font-medium text-base tracking-[-0.2px]">
        <li><a href="hato.html" class="text-black dark:text-white border-b-2 border-[#2f4a5c] dark:border-sky-400">Mi hato</a></li>
        <li><a href="index.html" class="text-black dark:text-white hover:border-b-2 hover:border-[#2f4a5c] dark:hover:border-sky-400">Sitio público</a></li>
      </ul>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle aria-label="Cambiar entre modo claro y oscuro" class="rounded-md border border-[#ddd6c9] dark:border-gray-600 px-3 py-2 text-sm font-medium text-black dark:text-white hover:bg-[#f8f8f8] dark:hover:bg-gray-800">🌓 Tema</button>
      </div>
    </nav>
  </header>

  <main class="max-w-[1100px] mx-auto px-4 py-10 md:px-6 lg:px-8">

    <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
      <div>
        <h1 class="font-['Fustat'] font-bold text-3xl tracking-[-1px] text-black dark:text-white">Mi hato</h1>
        <p class="text-[#505050] dark:text-gray-400">12 animales registrados</p>
      </div>
      <button type="button" class="rounded-md bg-black dark:bg-white text-white dark:text-black px-4 py-2 text-sm font-medium hover:bg-gray-700 dark:hover:bg-gray-200">+ Agregar animal</button>
    </div>

    <div class="flex flex-wrap gap-3 mb-6">
      <select class="rounded border border-[#ddd6c9] dark:border-gray-600 bg-white dark:bg-gray-800 text-sm px-3 py-2 text-[#2b2b26] dark:text-gray-100">
        <option>Todos los potreros</option>
        <option>Potrero 1</option>
        <option>Potrero 2</option>
      </select>
      <select class="rounded border border-[#ddd6c9] dark:border-gray-600 bg-white dark:bg-gray-800 text-sm px-3 py-2 text-[#2b2b26] dark:text-gray-100">
        <option>Todos los estados</option>
        <option>Al día</option>
        <option>Vacuna pendiente</option>
      </select>
    </div>

    <div class="rounded-lg border border-[#ddd6c9] dark:border-gray-700 overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-[#f8f8f8] dark:bg-gray-800 text-[#505050] dark:text-gray-400 uppercase text-xs">
          <tr>
            <th class="px-4 py-3">ID</th>
            <th class="px-4 py-3">Estado</th>
            <th class="px-4 py-3">Potrero</th>
            <th class="px-4 py-3">Última vacuna</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#ddd6c9] dark:divide-gray-700">
          <tr class="bg-white dark:bg-gray-900">
            <td class="px-4 py-3 font-medium text-black dark:text-white">#014</td>
            <td class="px-4 py-3"><span class="inline-block rounded-full bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300 px-2 py-1 text-xs font-medium">Al día</span></td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">Potrero 2</td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">12 mar 2026</td>
          </tr>
          <tr class="bg-white dark:bg-gray-900">
            <td class="px-4 py-3 font-medium text-black dark:text-white">#027</td>
            <td class="px-4 py-3"><span class="inline-block rounded-full bg-orange-100 text-orange-800 dark:bg-orange-900 dark:text-orange-300 px-2 py-1 text-xs font-medium">Vacuna pendiente</span></td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">Potrero 1</td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">03 ene 2026</td>
          </tr>
          <tr class="bg-white dark:bg-gray-900">
            <td class="px-4 py-3 font-medium text-black dark:text-white">#031</td>
            <td class="px-4 py-3"><span class="inline-block rounded-full bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-300 px-2 py-1 text-xs font-medium">Al día</span></td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">Potrero 2</td>
            <td class="px-4 py-3 text-[#2b2b26] dark:text-gray-300">28 feb 2026</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <footer class="text-center px-4 py-8 border-t border-[#ddd6c9] dark:border-gray-700 text-[#2b2b26] dark:text-gray-400">
    <p>DSAW — Universidad de La Sabana — HW04</p>
  </footer>

</body>
</html>
